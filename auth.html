<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7c600">
  <title>Conta • MotoFinance PRO</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #e8e8e3;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.mark{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:#f7c600;font-weight:900}.brand strong{display:block;font-size:18px}.brand small{color:#777}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#887000}h1{margin:5px 0 8px;font-size:28px}p{color:#666;line-height:1.5;margin:0 0 20px}.field{display:grid;gap:7px;margin:14px 0}.field span{font-size:13px;font-weight:700}.field input{width:100%;border:1px solid #d9d9d2;border-radius:13px;padding:13px 14px;font:inherit;outline:none}.field input:focus{border-color:#a58900;box-shadow:0 0 0 3px rgba(247,198,0,.18)}button{width:100%;border:0;border-radius:13px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;background:#171717;color:#fff;margin-top:8px}button:disabled{opacity:.55;cursor:wait}.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;margin-top:20px}.links a{color:#615100;font-size:13px;font-weight:700;text-decoration:none}.notice{display:none;padding:12px 14px;border-radius:12px;margin:14px 0;font-size:14px;line-height:1.45}.notice.show{display:block}.notice.error{background:#fff0f0;color:#8a1d1d}.notice.ok{background:#eef9f1;color:#196534}.notice.info{background:#f6f2dc;color:#675800}.back{display:inline-block;margin-top:22px;color:#555;text-decoration:none;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">MF</span><span><strong>MotoFinance PRO</strong><small>Conta e sincronização</small></span></div>
    <span class="eyebrow" id="eyebrow">Conta</span><h1 id="title">Entrar</h1><p id="description">Acesse sua conta para sincronizar seus dados entre aparelhos.</p>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <form id="authForm">
      <label class="field" id="emailField"><span>E-mail</span><input id="email" type="email" autocomplete="email" required></label>
      <label class="field" id="passwordField"><span>Senha</span><input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <label class="field" id="confirmField" hidden><span>Confirmar senha</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></label>
      <button id="submitButton" type="submit">Entrar</button>
    </form>
    <nav class="links" id="links"><a href="auth.html?mode=login">Entrar</a><a href="auth.html?mode=signup">Criar conta</a><a href="auth.html?mode=reset">Esqueci a senha</a></nav>
    <a class="back" href="./#more">← Voltar ao MotoFinance</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="sync-config.js"></script><script src="sync-core.js"></script><script src="auth.js"></script>
</body>
</html>
